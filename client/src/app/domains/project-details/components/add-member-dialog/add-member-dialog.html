<h2 mat-dialog-title class="text-xl font-bold text-gray-900 dark:text-white mb-4 border-b pb-3">
  Dodaj członka do projektu
</h2>
<form (ngSubmit)="onSubmit()">
  <mat-dialog-content class="py-4">
    <mat-form-field class="w-full">
      <mat-label>Email</mat-label>
      <input matInput [formControl]="emailFormControl" placeholder="pat@example.com">
      @if (emailFormControl.hasError('email') && !emailFormControl.hasError('required')) {
        <mat-error>Proszę wprowadzić prawidłowy adres email</mat-error>
      }
      @if (emailFormControl.hasError('required')) {
        <mat-error>Email jest <strong>wymagany</strong></mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="border-t pt-3 gap-3">
    <button appButton variant="outline" (click)="onCancelClick()" type="button">
      Anuluj
    </button>
    <button appButton type="submit" [disabled]="emailFormControl.invalid">
      Dodaj członka
    </button>
  </mat-dialog-actions>
</form>
