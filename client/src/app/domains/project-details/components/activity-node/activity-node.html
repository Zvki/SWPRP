<div class="bg-card border border-border rounded-xl p-4 shadow-sm space-y-3">

  <div class="flex items-start gap-3">

    <div class="w-10 h-10 rounded-full bg-muted shrink-0"></div>

    <div class="flex-1">
      <div class="text-sm mb-1">
        <strong class="text-foreground">
          {{ node.author.firstName }} {{ node.author.lastName }}
        </strong>

        <span class="text-muted-foreground">
          • {{ node.createdAt | date:'short' }}
        </span>
      </div>

      <div class="text-foreground/90 leading-relaxed whitespace-pre-line">
        {{ node.content }}
      </div>

      @if(node.type === 'FILE' && node.file !== null) {
        <div class="flex items-center gap-3 p-3 border border-border rounded-lg bg-muted/30">

          <div class="w-10 h-10 rounded-md bg-muted flex items-center justify-center text-xl">
            📄
          </div>

          <div class="flex-1">
            <div class="text-foreground font-medium">
              {{ node.file?.name }}
            </div>
          </div>

          <a [href]="'http://localhost:8080'+node.file?.url"
             target="_blank"
             download
          >
            <button appButton size="icon"><i class="ri-file-download-line"></i></button>
          </a>

        </div>
      }

    </div>
  </div>

  <div class="mt-4 border border-border rounded-lg p-3 bg-muted/20 space-y-2">
    <textarea
      [(ngModel)]="content"
      rows="2"
      class="text-foreground w-full bg-card border border-border rounded-md p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
      placeholder="Napisz odpowiedź..."></textarea>

    <button appButton size="sm" variant="default"
            (click)="onSendReply()">
      Odpowiedz
    </button>
  </div>

</div>
