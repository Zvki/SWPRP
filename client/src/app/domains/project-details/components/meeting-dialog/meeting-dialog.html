<h2 mat-dialog-title class="text-xl font-bold border-b pb-2">Utwórz Nowe Spotkanie</h2>

<div mat-dialog-content class="space-y-4 py-4">

  <div>
    <label class="text-sm font-medium text-foreground block mb-1">Tytuł spotkania<span class="text-red-500">*</span></label>
    <input
      type="text"
      [(ngModel)]="title"
      class="w-full border border-border rounded-md p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
      placeholder="Np. Omówienie Raportu Q3">
  </div>

  <div class="flex gap-4">
    <div class="flex-1">
      <label class="text-sm font-medium text-foreground block mb-1">Data<span class="text-red-500">*</span></label>
      <input
        type="date"
        [(ngModel)]="meetingDate"
        class="w-full border border-border rounded-md p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
    </div>
    <div class="flex-1">
      <label class="text-sm font-medium text-foreground block mb-1">Czas<span class="text-red-500">*</span></label>
      <input
        type="time"
        [(ngModel)]="meetingTime"
        class="w-full border border-border rounded-md p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
    </div>
  </div>

  <div>
    <label class="text-sm font-medium text-foreground block mb-1">Link do Spotkania (URL)</label>
    <input
      type="url"
      [(ngModel)]="meetingUrl"
      class="w-full border border-border rounded-md p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
      placeholder="Np. https://zoom.us/j/123456">
  </div>

  <div>
    <label class="text-sm font-medium text-foreground block mb-1">Opis</label>
    <textarea
      [(ngModel)]="description"
      rows="3"
      class="w-full border border-border rounded-md p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
      placeholder="Dodatkowe informacje o agendzie..."></textarea>
  </div>

  @if (submitError) {
    <p class="text-red-500 text-sm">{{ submitError }}</p>
  }
</div>

<div mat-dialog-actions align="end" class="border-t pt-3">
  <button appButton variant="destructive" (click)="onCancel()" [disabled]="loading">Anuluj</button>
  <button
    appButton
    variant="default"
    (click)="onCreateMeeting()"
    [disabled]="loading || !title || !meetingDate || !meetingTime">
    @if (loading) {
      <i class="ri-loader-4-line animate-spin mr-1"></i> Tworzenie...
    } @else {
      Utwórz Spotkanie
    }
  </button>
</div>
