@if (commentsTree().length === 0) {
  <div class="items-center justify-center mt-4">
    <div class="flex flex-col items-center text-center p-10 border border-dashed border-primary/30 rounded-lg bg-background/80">
      <i class="text-3xl text-primary/80"><i class="ri-emotion-sad-line"></i></i>
      <p class="text-lg font-medium text-primary/80 mt-2">Brak wpisów.</p>
      <p class="text-sm text-primary/80">Bądź pierwszy i dodaj nową pozycję.</p>
    </div>
  </div>
} @else {
  <section class="mt-4">
    <app-activity-tree
      [list]="commentsTree()"
      [projectId]="projectId">
    </app-activity-tree>
  </section>
}

<section class="mt-4 p-4 bg-card border border-border rounded-xl shadow-md flex flex-col gap-3">

  <div class="flex-1">
    <textarea
      [(ngModel)]="rootCommentContent"
      rows="3"
      class="text-foreground w-full bg-card border border-border rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-primary"
      placeholder="Napisz nowy komentarz...">
    </textarea>
  </div>

  <div class="flex justify-between items-center"> <div class="flex gap-2">
    <button
      appButton
      variant="outline"
      (click)="openFileUploadDialog()"
      title="Dodaj Plik"> <i class="ri-file-add-line"></i>
      <span class="hidden sm:inline ml-2">Dodaj Plik</span>
    </button>

    <button
      appButton
      variant="outline"
      (click)="openMeetingDialog()"
      title="Dodaj Spotkanie">
      <i class="ri-calendar-event-line"></i>
      <span class="hidden sm:inline ml-2">Dodaj Spotkanie</span>
    </button>
  </div>

    <button
      appButton
      size="sm"
      variant="default"
      (click)="sendRootComment()">
      <span>Wyślij <span class="hidden sm:inline">Komentarz</span></span>
    </button>
  </div>
</section>
