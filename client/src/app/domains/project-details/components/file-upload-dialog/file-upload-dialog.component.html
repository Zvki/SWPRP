<h2 mat-dialog-title class="text-xl font-bold text-gray-900 dark:text-white mb-4 border-b pb-3">
  Dodaj nowy plik
</h2>

<div [formGroup]="fileForm">
  <mat-dialog-content class="space-y-4 py-4">
    <div class="border border-dashed border-border p-4 rounded-lg bg-background/20">
      <label for="fileInput" class="cursor-pointer block text-center">
        <div class="text-3xl mb-2 text-primary/80"><i class="ri-file-add-line mr-2"></i></div>
        <div class="font-medium text-primary/80">
          {{ file ? file.name : 'Kliknij lub przeciągnij, aby wybrać plik' }}
        </div>
      </label>
      <input
        id="fileInput"
        type="file"
        (change)="onFileSelected($event)"
        class="hidden"/>
    </div>

    <mat-form-field class="w-full">
      <mat-label>Opcjonalny komentarz do pliku</mat-label>
      <textarea matInput
                rows="2"
                placeholder="Dodaj opis, kontekst lub uwagi..."
                formControlName="content"></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <div mat-dialog-actions align="end" class="border-t pt-3 gap-3">
    <button appButton variant="outline" (click)="onCancel()" type="button" [disabled]="isLoading">
      Anuluj
    </button>
    <button
      appButton
      type="button"
      (click)="onUpload()"
      [disabled]="!file || fileForm.invalid || isLoading">
      Prześlij plik
    </button>
  </div>
</div>
