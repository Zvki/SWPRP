server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ZMIANA 1: Usunąłem slash na końcu location (łapie /swprp i /swprp/)
    location /swprp {
        # Ważne: upewnij się, że w docker-compose usługa Javy nazywa się 'backend'
        proxy_pass http://backend:8081;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ZMIANA 2: Ten nagłówek jest kluczowy dla Keycloaka/Spring Security
        proxy_set_header X-Forwarded-Proto $scheme;

        # Opcjonalnie: Zwiększenie timeoutów, jeśli Java długo wstaje
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
    }

    location /actuator/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme; # Tu też warto dodać
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
